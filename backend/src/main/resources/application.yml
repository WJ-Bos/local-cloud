spring:
  application:
    name: local-cloud-control-plane

  datasource:
    url: jdbc:postgresql://localhost:5432/control_plane
    username: control_plane
    password: control_plane
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: "/api/v1"

# Application-specific configuration
app:
  docker:
    host: "npipe:////./pipe/docker_engine"  # Windows Docker Desktop default; override via APP_DOCKER_HOST env var
  cors:
    allowed-origins:
      - http://localhost:5173  # Vite dev server
      - http://localhost:3000  # Production frontend
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - X-Requested-With
    exposed-headers:
      - X-Total-Count
      - X-Page-Number
      - X-Page-Size
    allow-credentials: true
    max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    wbos.backend: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

security:
  encryption:
    key: "9f3c2a7b4d8e1f605a9c3b7d2e4f8a1c6d7e9b0a3f5c2d1e8a7b6c5d4e3f2a1b"
